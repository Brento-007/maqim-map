<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑪奇M地圖信息</title>
    <!-- 1. 引入外部 CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <!-- 语言切换 -->
    <button id="lang-toggle" type="button" title="切換為简体">
        <span class="lang-opt active" data-lang="zh-Hans">简</span><span class="lang-sep">/</span><span class="lang-opt" data-lang="zh-Hant">繁</span>
    </button>

    <!-- 标题 -->
    <div class="header">
        <h1 data-i18n="瑪奇M地圖信息">瑪奇M地圖信息</h1>
        <p data-i18n="版本更新至S0賽季">版本更新至S0賽季</p>
    </div>

    <!-- 区域标签 -->
    <div class="region-tags" id="region-tags">
        <span class="active" data-region="airlene">愛爾琳世界</span>
        <span data-region="tirchonaill">提爾克那</span>
        <span data-region="dugard">杜加德走廊</span>
        <span data-region="wolf">狼之森林</span>
        <span data-region="goddess">女神庭園</span>
        <span data-region="dunbarton">杜巴頓</span>
        <span data-region="ciar">庫漢</span>
        <span data-region="frost">冰霜峽谷</span>
        <span data-region="bangor">班克爾</span>
        <span data-region="lairt">萊爾特丘陵</span>
        <span data-region="cloud">雲海曠野</span>
        <span data-region="sidd">希德斯特雪原</span>
        <span data-region="emain">艾明馬夏</span>
    </div>

    <!-- 主体内容 -->
    <div class="main-content">
        <!-- 地图区 -->
        <div class="map-container" id="map-box">
            <!-- 真正的 1000x1000 坐标系 -->
            <div class="map-inner">
                <img id="map-image" src="https://picsum.photos/1000/1000?random=1" alt="地圖區域">
                <!-- 坐标点容器 -->
                <div id="markers-container"></div>
            </div>
        </div>

        <!-- 侧边栏信息 -->
        <div class="info-panel">
            <div class="info-header" id="info-title">愛爾琳世界</div>
            <!-- 留空，等待 JS 动态填充 -->
            <ul class="info-list" id="info-list-container"></ul>
        </div>
    </div>
</div>

<!-- 2. 引入外部 JS -->
<script src="lang.js"></script>
<script src="script.js"></script>
</body>
</html>
